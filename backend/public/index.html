<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Gateway - ADMS & TCP Pull Dashboard</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Socket.io Client -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <!-- Day.js -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      /* Slate 50 */
      color: #0f172a;
      /* Slate 900 */
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      /* Slate 100 */
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      /* Slate 300 */
      border-radius: 4px;
    }

    .animate-pulse-slow {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body class="custom-scrollbar min-h-screen flex flex-col">

  <!-- NOTIFICATION FLUSH LIST -->
  <div id="notifications-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- APP CONTAINER -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Main Vanilla Script -->
  <script>
    const API_BASE = window.location.origin;

    // State Global Aplikasi
    const state = {
      isLoggedIn: sessionStorage.getItem('attendance_gateway_auth') === 'true',
      activeTab: 'logs', // 'logs', 'devices', 'sync'
      logs: [],
      logLoading: false,
      filterPin: '',
      filterStatus: 'all',
      filterDate: '',
      socketStatus: 'disconnected',
      devices: [],
      deviceLoading: false,
      editingDeviceId: null,
      deviceForm: { device_id: '', nama: '', ip_address: '', lokasi: '', aktif: 1 },
      syncState: {
        isSyncing: false,
        status: 'idle',
        currentMachine: null,
        currentMachineIndex: 0,
        totalMachines: 0,
        progress: 0,
        processedCount: 0,
        totalCount: 0,
        inserted: 0,
        skipped: 0,
        errors: 0,
        timeRemaining: null,
        errorMsg: null,
        lastSync: null,
        machineSummaries: []
      }
    };

    let socket = null;

    // Toast Notification
    function showNotification(message, type = 'info') {
      const container = document.getElementById('notifications-container');
      if (!container) return;

      const id = Date.now();
      const div = document.createElement('div');
      div.id = `toast-${id}`;
      div.className = `flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-sm font-semibold transition-all transform translate-y-0 ${type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' :
        type === 'error' ? 'bg-rose-50 text-rose-850 border-rose-200' :
          'bg-sky-50 text-sky-850 border-sky-200'
        }`;
      div.innerHTML = `
        <span class="w-2.5 h-2.5 rounded-full bg-current animate-ping"></span>
        <span>${message}</span>
      `;
      container.appendChild(div);

      setTimeout(() => {
        const target = document.getElementById(`toast-${id}`);
        if (target) target.remove();
      }, 4000);
    }

    // --- CALL API ---

    async function fetchLogs() {
      if (!state.isLoggedIn) return;
      state.logLoading = true;
      render();
      try {
        const params = new URLSearchParams({ limit: '100' });
        if (state.filterPin) params.append('pin', state.filterPin);
        if (state.filterStatus !== 'all') params.append('status', state.filterStatus);
        if (state.filterDate) {
          params.append('startDate', state.filterDate);
          params.append('endDate', state.filterDate);
        }
        const res = await fetch(`${API_BASE}/api/absensi?${params}`);
        const json = await res.json();
        if (json.success) {
          state.logs = json.data || [];
        }
      } catch (err) {
        console.error(err);
        showNotification('Gagal memuat log absensi', 'error');
      } finally {
        state.logLoading = false;
        render();
      }
    }

    async function fetchDevices() {
      if (!state.isLoggedIn) return;
      state.deviceLoading = true;
      render();
      try {
        const res = await fetch(`${API_BASE}/api/devices`);
        const json = await res.json();
        if (json.success) {
          state.devices = json.data || [];
        }
      } catch (err) {
        console.error(err);
        showNotification('Gagal memuat daftar mesin', 'error');
      } finally {
        state.deviceLoading = false;
        render();
      }
    }

    async function fetchSyncStatus() {
      if (!state.isLoggedIn) return;
      try {
        const res = await fetch(`${API_BASE}/api/mesin/sync/status`);
        const json = await res.json();
        if (json.success) {
          state.syncState = json.data;
        }
      } catch (err) {
        console.error(err);
      }
    }

    // --- ACTIONS ---

    function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username')?.value || '';
      const passwordInput = document.getElementById('password')?.value || '';

      if (usernameInput.trim() === 'khfdz' && passwordInput === '121212') {
        sessionStorage.setItem('attendance_gateway_auth', 'true');
        state.isLoggedIn = true;
        showNotification('Login berhasil!', 'success');
        initSocket();
        fetchLogs();
        fetchDevices();
        fetchSyncStatus();
      } else {
        const errorDiv = document.getElementById('auth-error-msg');
        if (errorDiv) {
          errorDiv.innerText = 'Username atau password salah.';
          errorDiv.parentElement.classList.remove('hidden');
        }
        showNotification('Username atau password salah', 'error');
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('attendance_gateway_auth');
      state.isLoggedIn = false;
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      showNotification('Logout sukses', 'info');
      render();
    }

    async function handleDeviceSubmit(e) {
      e.preventDefault();
      const deviceIdVal = document.getElementById('dev-id')?.value || '';
      const namaVal = document.getElementById('dev-nama')?.value || '';
      const ipVal = document.getElementById('dev-ip')?.value || '';
      const lokasiVal = document.getElementById('dev-lokasi')?.value || '';

      const body = {
        device_id: deviceIdVal,
        nama: namaVal,
        ip_address: ipVal,
        lokasi: lokasiVal,
        aktif: state.deviceForm.aktif
      };

      try {
        const url = state.editingDeviceId
          ? `${API_BASE}/api/devices/${state.editingDeviceId}`
          : `${API_BASE}/api/devices`;
        const method = state.editingDeviceId ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();

        if (json.success) {
          showNotification(state.editingDeviceId ? 'Mesin diperbarui' : 'Mesin didaftarkan', 'success');
          state.editingDeviceId = null;
          state.deviceForm = { device_id: '', nama: '', ip_address: '', lokasi: '', aktif: 1 };
          fetchDevices();
        } else {
          showNotification(json.message || 'Gagal menyimpan', 'error');
        }
      } catch (err) {
        showNotification('Gagal menyimpan mesin', 'error');
      }
    }

    async function handleDeleteDevice(id) {
      if (!confirm('Hapus mesin ini?')) return;
      try {
        const res = await fetch(`${API_BASE}/api/devices/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          showNotification('Mesin berhasil dihapus', 'success');
          fetchDevices();
        }
      } catch (err) {
        showNotification('Gagal menghapus mesin', 'error');
      }
    }

    async function handleStartSync() {
      try {
        const res = await fetch(`${API_BASE}/api/mesin/sync`, { method: 'POST' });
        const json = await res.json();
        if (json.success) {
          state.syncState = json.data;
          showNotification('Sinkronisasi TCP Pull dimulai', 'info');
          render();
        }
      } catch (err) {
        showNotification('Gagal memicu sinkronisasi', 'error');
      }
    }

    // --- SOCKET.IO ---
    function initSocket() {
      if (socket) return;
      socket = io(API_BASE);

      socket.on('connect', () => {
        state.socketStatus = 'connected';
        render();
      });

      socket.on('disconnect', () => {
        state.socketStatus = 'disconnected';
        render();
      });

      socket.on('absensi:baru', (data) => {
        state.logs = [data, ...state.logs].slice(0, 100);
        showNotification(`Scan Baru! PIN: ${data.pin} (${data.status})`, 'success');
        render();
      });

      socket.on('sync:progress', (syncData) => {
        state.syncState = syncData;
        render();
      });
    }

    // --- POLLING FOR SYNC STATUS ---
    setInterval(() => {
      if (state.isLoggedIn && state.syncState.isSyncing) {
        fetchSyncStatus().then(() => render());
      }
    }, 2000);

    // --- DOM RENDERING ENGINE ---

    function render() {
      const appDiv = document.getElementById('app');
      if (!appDiv) return;

      if (!state.isLoggedIn) {
        // Render Login Page
        appDiv.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-100/50 via-slate-50 to-slate-100">
            <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl space-y-6 relative overflow-hidden">
              <div class="absolute top-0 left-0 w-full h-[4px] bg-gradient-to-r from-indigo-600 to-sky-500"></div>
              
              <div class="text-center space-y-2.5">
                <div class="inline-flex bg-indigo-50 border border-indigo-100/80 p-3.5 rounded-2xl text-indigo-600 shadow-sm">
                  <i data-lucide="fingerprint" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Attendance Gateway</h2>
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Silakan login untuk mengakses dashboard</p>
              </div>

              <div id="auth-error-box" class="bg-rose-50 border border-rose-200 text-rose-600 px-4 py-3 rounded-2xl text-xs font-bold flex items-center gap-2 hidden animate-pulse">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="auth-error-msg"></span>
              </div>

              <form id="login-form" class="space-y-4">
                <div class="space-y-1.5">
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Username</label>
                  <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input 
                      type="text" 
                      id="username" 
                      placeholder="Masukkan username"
                      required
                      class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-10 pr-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                    />
                  </div>
                </div>

                <div class="space-y-1.5">
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Password</label>
                  <div class="relative">
                    <i data-lucide="key" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input 
                      type="password" 
                      id="password" 
                      placeholder="••••••••"
                      required
                      class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-10 pr-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                    />
                  </div>
                </div>

                <button 
                  type="submit"
                  class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white py-3.5 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-indigo-600/20"
                >
                  <i data-lucide="log-in" class="w-4 h-4"></i>
                  Masuk Ke Aplikasi
                </button>
              </form>

              <div class="text-center text-[10px] text-slate-400 font-semibold uppercase tracking-wider pt-2 border-t border-slate-100">
                Attendance Gateway Boilerplate &copy; 2026
              </div>
            </div>
          </div>
        `;
        document.getElementById('login-form')?.addEventListener('submit', handleLogin);
      } else {
        // Render Dashboard Page
        appDiv.innerHTML = `
          <header class="bg-white border-b border-slate-200/80 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-40">
            <div class="flex items-center gap-3">
              <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                <i data-lucide="fingerprint" class="w-6 h-6 animate-pulse"></i>
              </div>
              <div>
                <h1 class="text-lg font-bold text-slate-900 tracking-tight">Attendance Gateway</h1>
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Solution</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-3 text-xs text-slate-700">
              <span class="flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200 font-semibold shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full ${state.socketStatus === 'connected' ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}"></span>
                ADMS Push: ${state.socketStatus === 'connected' ? 'Aktif' : 'Nonaktif'}
              </span>
              <span class="flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200 font-semibold shadow-sm">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-indigo-605 ${state.syncState.isSyncing ? 'animate-spin' : ''}"></i>
                TCP Pull: ${state.syncState.isSyncing ? 'Syncing...' : 'Standby'}
              </span>
              <button 
                id="btn-logout"
                class="flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3.5 py-1.5 rounded-full font-bold transition-all shadow-sm"
              >
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                Keluar
              </button>
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 space-y-3">
              <button id="tab-logs" class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl font-bold transition-all text-sm border ${state.activeTab === 'logs' ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-600/10' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 shadow-sm'}">
                <span class="flex items-center gap-2.5">
                  <i data-lucide="list-collapse" class="w-4 h-4"></i>
                  Log Absensi Terkini
                </span>
                <span class="text-xs px-2 py-0.5 rounded-full ${state.activeTab === 'logs' ? 'bg-indigo-700 text-indigo-100' : 'bg-slate-100 text-slate-600'}">${state.logs.length}</span>
              </button>

              <button id="tab-devices" class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl font-bold transition-all text-sm border ${state.activeTab === 'devices' ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-600/10' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 shadow-sm'}">
                <span class="flex items-center gap-2.5">
                  <i data-lucide="server" class="w-4 h-4"></i>
                  Mesin Absensi (TCP)
                </span>
                <span class="text-xs px-2 py-0.5 rounded-full ${state.activeTab === 'devices' ? 'bg-indigo-700 text-indigo-100' : 'bg-slate-100 text-slate-600'}">${state.devices.length}</span>
              </button>

              <button id="tab-sync" class="w-full flex items-center justify-between px-4 py-3.5 rounded-2xl font-bold transition-all text-sm border ${state.activeTab === 'sync' ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-600/10' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 shadow-sm'}">
                <span class="flex items-center gap-2.5">
                  <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                  Tarik Data Manual
                </span>
                ${state.syncState.isSyncing ? '<span class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-ping"></span>' : ''}
              </button>

              <div class="bg-white border border-slate-200/80 rounded-2xl p-4 space-y-2.5 text-xs text-slate-500 font-medium shadow-sm">
                <div class="flex items-center gap-1 text-slate-800 font-bold">
                  <i data-lucide="info" class="w-4 h-4 text-indigo-600 shrink-0"></i>
                  <span>Panduan Endpoint ADMS</span>
                </div>
                <p class="leading-relaxed">
                  Jika menggunakan **ADMS Push Mode**, masuk to menu mesin absensi lalu arahkan server komunikasi ke port:
                </p>
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 font-mono text-[11px] text-indigo-650 break-all select-all font-semibold">
                  http://${window.location.hostname || 'IP_SERVER'}:${window.location.port || '6032'}/
                </div>
              </div>
            </div>

            <div class="lg:col-span-3">
              ${renderTabContent()}
            </div>
          </main>

          <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-400 font-semibold uppercase tracking-wider">
            khfdz &copy; 2026. All rights reserved.
          </footer>
        `;

        // Register tab click events
        document.getElementById('tab-logs')?.addEventListener('click', () => { state.activeTab = 'logs'; render(); });
        document.getElementById('tab-devices')?.addEventListener('click', () => { state.activeTab = 'devices'; render(); });
        document.getElementById('tab-sync')?.addEventListener('click', () => { state.activeTab = 'sync'; render(); });
        document.getElementById('btn-logout')?.addEventListener('click', handleLogout);

        // Register custom events depending on active tab
        if (state.activeTab === 'logs') {
          document.getElementById('btn-search-logs')?.addEventListener('click', () => {
            state.filterPin = document.getElementById('search-pin')?.value || '';
            state.filterStatus = document.getElementById('search-status')?.value || 'all';
            state.filterDate = document.getElementById('search-date')?.value || '';
            fetchLogs();
          });
        } else if (state.activeTab === 'devices') {
          document.getElementById('device-form')?.addEventListener('submit', handleDeviceSubmit);

          document.getElementById('btn-cancel-edit')?.addEventListener('click', () => {
            state.editingDeviceId = null;
            state.deviceForm = { device_id: '', nama: '', ip_address: '', lokasi: '', aktif: 1 };
            render();
          });
        } else if (state.activeTab === 'sync') {
          document.getElementById('btn-trigger-sync')?.addEventListener('click', handleStartSync);
        }
      }

      lucide.createIcons();
    }

    function renderTabContent() {
      if (state.activeTab === 'logs') {
        return `
          <div class="space-y-4">
            <div class="bg-white border border-slate-200/80 rounded-2xl p-4 grid grid-cols-1 md:grid-cols-12 gap-3 items-end animate-fade-in shadow-sm">
              <div class="md:col-span-4 space-y-1">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Cari PIN</label>
                <input 
                  type="text" 
                  id="search-pin"
                  placeholder="Ketik PIN..."
                  value="${state.filterPin}"
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                />
              </div>
              <div class="md:col-span-3 space-y-1">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Status Absen</label>
                <select 
                  id="search-status"
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                >
                  <option value="all" ${state.filterStatus === 'all' ? 'selected' : ''}>Semua Status</option>
                  <option value="masuk" ${state.filterStatus === 'masuk' ? 'selected' : ''}>Masuk</option>
                  <option value="pulang" ${state.filterStatus === 'pulang' ? 'selected' : ''}>Pulang</option>
                  <option value="lembur_masuk" ${state.filterStatus === 'lembur_masuk' ? 'selected' : ''}>Lembur Masuk</option>
                  <option value="lembur_pulang" ${state.filterStatus === 'lembur_pulang' ? 'selected' : ''}>Lembur Pulang</option>
                </select>
              </div>
              <div class="md:col-span-3 space-y-1">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Tanggal Scan</label>
                <input 
                  type="date"
                  id="search-date"
                  value="${state.filterDate}"
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                />
              </div>
              <div class="md:col-span-2">
                <button 
                  id="btn-search-logs"
                  class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-1.5 transition-all shadow-md shadow-indigo-600/10 h-10"
                >
                  <i data-lucide="search" class="w-4 h-4"></i>
                  Cari
                </button>
              </div>
            </div>

            <div class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-sm">
              <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 font-bold uppercase tracking-wider">
                      <th class="py-3.5 px-4 w-12 text-center">No</th>
                      <th className="py-3.5 px-4 w-28">PIN Absensi</th>
                      <th className="py-3.5 px-4">Waktu Scan (Mesin)</th>
                      <th className="py-3.5 px-4 text-center">Status</th>
                      <th className="py-3.5 px-4">IP / Mesin</th>
                      <th className="py-3.5 px-4">Waktu Diterima</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-sm">
                    ${state.logLoading ? `
                      <tr>
                        <td colSpan="6" class="py-12 text-center text-slate-500">
                          <div class="flex flex-col items-center gap-2">
                            <i data-lucide="refresh-cw" class="w-6 h-6 animate-spin text-indigo-600"></i>
                            <span class="font-semibold text-xs text-slate-500">Sedang memuat data...</span>
                          </div>
                        </td>
                      </tr>
                    ` : state.logs.length === 0 ? `
                      <tr>
                        <td colSpan="6" class="py-12 text-center text-slate-450 font-semibold text-xs">
                          Tidak ada log transaksi absensi ditemukan.
                        </td>
                      </tr>
                    ` : state.logs.map((row, idx) => `
                      <tr class="hover:bg-slate-50/80 transition-colors text-slate-900 font-medium">
                        <td class="py-3.5 px-4 text-center text-slate-450 text-xs font-semibold">${idx + 1}</td>
                        <td class="py-3.5 px-4">
                          <span class="font-mono text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 px-2.5 py-0.5 rounded-lg">${row.pin}</span>
                        </td>
                        <td class="py-3.5 px-4 font-mono font-semibold text-slate-600">${row.waktu}</td>
                        <td class="py-3.5 px-4 text-center">
                          <span class="inline-flex items-center gap-1 text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full border ${row.status.includes('masuk')
            ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
            : 'bg-amber-50 text-amber-700 border-amber-200'
          }">
                            <span class="w-1.5 h-1.5 rounded-full ${row.status.includes('masuk') ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                            ${row.status.replace('_', ' ')}
                          </span>
                        </td>
                        <td class="py-3.5 px-4 text-slate-600 text-xs font-medium">
                          <span class="flex items-center gap-1.5">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i>
                            ${row.device_id || row.ip_source || 'Unknown'}
                          </span>
                        </td>
                        <td class="py-3.5 px-4 text-slate-400 text-xs font-medium">${row.created_at || '-'}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      } else if (state.activeTab === 'devices') {
        return `
          <div class="space-y-6">
            <form id="device-form" class="bg-white border border-slate-200/80 rounded-2xl p-5 space-y-4 animate-fade-in shadow-sm">
              <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i>
                ${state.editingDeviceId ? 'Edit Mesin Absensi' : 'Tambah Mesin Absensi Baru (TCP Pull)'}
              </h3>
              <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="space-y-1">
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Serial Number/ID</label>
                  <input 
                    type="text" 
                    id="dev-id"
                    placeholder="Contoh: SN-X100C-01"
                    required
                    value="${state.deviceForm.device_id}"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                  />
                </div>
                <div class="space-y-1">
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Nama Mesin</label>
                  <input 
                    type="text" 
                    id="dev-nama"
                    placeholder="Contoh: Mesin Lobby"
                    required
                    value="${state.deviceForm.nama}"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                  />
                </div>
                <div class="space-y-1">
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">IP Address</label>
                  <input 
                    type="text" 
                    id="dev-ip"
                    placeholder="Contoh: 192.168.1.201"
                    required
                    value="${state.deviceForm.ip_address}"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                  />
                </div>
                <div class="space-y-1">
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Lokasi / Keterangan</label>
                  <input 
                    type="text" 
                    id="dev-lokasi"
                    placeholder="Contoh: Gedung A"
                    value="${state.deviceForm.lokasi}"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-500 transition-colors"
                  />
                </div>
              </div>

              <div class="flex gap-2 justify-end">
                ${state.editingDeviceId ? `
                  <button 
                    type="button"
                    id="btn-cancel-edit"
                    class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-bold text-slate-600 transition-colors"
                  >
                    Batal
                  </button>
                ` : ''}
                <button 
                  type="submit"
                  class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition-all shadow-md shadow-indigo-600/10"
                >
                  ${state.editingDeviceId ? 'Simpan Perubahan' : 'Daftarkan Mesin'}
                </button>
              </div>
            </form>

            <div class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-sm">
              <div class="p-4 border-b border-slate-200 font-bold text-slate-800 text-xs uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="list" class="w-4 h-4 text-indigo-600"></i>
                Daftar Mesin Terdaftar
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 font-bold uppercase tracking-wider">
                      <th class="py-3 px-4">Serial Number</th>
                      <th class="py-3 px-4">Nama Mesin</th>
                      <th class="py-3 px-4">IP Address</th>
                      <th class="py-3 px-4">Lokasi</th>
                      <th class="py-3 px-4 text-center">Status Pull</th>
                      <th class="py-3 px-4 text-center">Aksi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-sm font-semibold">
                    ${state.deviceLoading ? `
                      <tr>
                        <td colSpan="6" class="py-6 text-center text-slate-500 font-semibold text-xs">Memuat daftar mesin...</td>
                      </tr>
                    ` : state.devices.length === 0 ? `
                      <tr>
                        <td colSpan="6" class="py-6 text-center text-slate-400 font-semibold text-xs">Belum ada mesin absensi yang didaftarkan.</td>
                      </tr>
                    ` : state.devices.map(d => `
                      <tr class="hover:bg-slate-50/80 transition-colors text-slate-800">
                        <td class="py-3 px-4 font-mono font-bold text-slate-700">${d.device_id}</td>
                        <td class="py-3 px-4 text-slate-900">${d.nama}</td>
                        <td class="py-3 px-4 font-mono font-semibold text-indigo-600">${d.ip_address}:4370</td>
                        <td class="py-3 px-4 text-slate-500 text-xs font-semibold">${d.lokasi || '-'}</td>
                        <td class="py-3 px-4 text-center">
                          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase ${d.aktif === 1
            ? 'bg-indigo-50 text-indigo-700 border border-indigo-200'
            : 'bg-slate-100 text-slate-500 border border-slate-200'
          }">
                            ${d.aktif === 1 ? 'Aktif (Auto-Sync)' : 'Nonaktif'}
                          </span>
                        </td>
                        <td class="py-3 px-4 text-center">
                          <div class="flex justify-center gap-1.5">
                            <button 
                              onclick="editDevice(${d.id}, '${d.device_id}', '${d.nama}', '${d.ip_address}', '${d.lokasi || ''}', ${d.aktif})"
                              class="p-1.5 hover:bg-indigo-50/50 rounded-lg border border-slate-200 text-indigo-600 hover:text-indigo-700 transition-colors"
                              title="Edit"
                            >
                              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            </button>
                            <button 
                              onclick="handleDeleteDevice(${d.id})"
                              class="p-1.5 hover:bg-rose-50 rounded-lg border border-slate-200 text-rose-600 hover:text-rose-700 transition-colors"
                              title="Hapus"
                            >
                              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      } else if (state.activeTab === 'sync') {
        return `
          <div class="space-y-6">
            <div class="bg-white border border-slate-200/80 rounded-2xl p-5 space-y-6 shadow-sm relative overflow-hidden animate-fade-in">
              ${state.syncState.isSyncing ? '<div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-indigo-500 via-sky-500 to-emerald-500 animate-pulse"></div>' : ''}

              <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                  <h3 class="font-bold text-slate-800 text-sm">Status Sinkronisasi TCP (ZKLib Pull)</h3>
                  <p class="text-xs text-slate-500 font-semibold mt-1">
                    ${state.syncState.isSyncing
            ? `Menghubungkan ke ${state.syncState.currentMachine || "mesin absensi"}...`
            : 'Scheduler otomatis berjalan di latar belakang setiap 5 menit.'
          }
                  </p>
                </div>

                <button 
                  id="btn-trigger-sync"
                  ${state.syncState.isSyncing ? 'disabled' : ''}
                  class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold px-6 py-2.5 rounded-2xl text-xs flex items-center gap-2 transition-all shadow-lg shadow-indigo-600/10 shrink-0"
                >
                  <i data-lucide="refresh-cw" class="w-4 h-4 ${state.syncState.isSyncing ? 'animate-spin' : ''}"></i>
                  ${state.syncState.isSyncing ? 'Sedang Sinkronisasi...' : 'Mulai Sinkronisasi Sekarang'}
                </button>
              </div>

              ${state.syncState.isSyncing ? `
                <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-3 animate-pulse-slow animate-pulse">
                  <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-indigo-600 uppercase tracking-wider">
                      Mesin (${state.syncState.currentMachineIndex}/${state.syncState.totalMachines}): ${state.syncState.currentMachine}
                    </span>
                    <span class="text-indigo-700 font-mono">${state.syncState.progress}%</span>
                  </div>
                  
                  <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div 
                      class="bg-indigo-600 h-full rounded-full transition-all duration-300" 
                      style="width: ${state.syncState.progress}%"
                    ></div>
                  </div>

                  <div class="flex flex-col sm:flex-row justify-between text-xs text-slate-500 font-semibold gap-1.5 pt-1">
                    <div>
                      Tahap: <span class="text-slate-800 uppercase font-bold">${state.syncState.status}</span>
                    </div>
                    ${state.syncState.timeRemaining ? `
                      <div class="text-amber-600 flex items-center gap-1">
                        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                        Estimasi sisa waktu: ${state.syncState.timeRemaining}
                      </div>
                    ` : ''}
                  </div>
                </div>
              ` : ''}

              ${state.syncState.lastSync ? `
                <div class="border-t border-slate-200 pt-4 grid grid-cols-1 md:grid-cols-4 gap-4 text-xs font-semibold">
                  <div class="space-y-1">
                    <span class="text-slate-400 uppercase tracking-wider text-[10px] font-extrabold block">Waktu Terakhir Sinkronisasi</span>
                    <span class="text-slate-900 font-bold text-sm block">
                      ${dayjs(state.syncState.lastSync.time).format('DD MMMM YYYY, HH:mm:ss')}
                    </span>
                  </div>
                  <div class="space-y-1 border-t md:border-t-0 md:border-l border-slate-200 pt-2.5 md:pt-0 md:pl-4">
                    <span class="text-slate-400 uppercase tracking-wider text-[10px] font-extrabold block">Data Baru Tersimpan</span>
                    <span class="text-emerald-600 text-base font-extrabold block">+${state.syncState.lastSync.inserted}</span>
                  </div>
                  <div class="space-y-1 border-t md:border-t-0 md:border-l border-slate-200 pt-2.5 md:pt-0 md:pl-4">
                    <span class="text-slate-400 uppercase tracking-wider text-[10px] font-extrabold block">Data Duplikat Dilewati</span>
                    <span class="text-slate-500 text-base font-extrabold block">${state.syncState.lastSync.skipped}</span>
                  </div>
                  <div class="space-y-1 border-t md:border-t-0 md:border-l border-slate-200 pt-2.5 md:pt-0 md:pl-4">
                    <span class="text-slate-400 uppercase tracking-wider text-[10px] font-extrabold block">Koneksi Error</span>
                    <span class="text-rose-600 text-base font-extrabold block">${state.syncState.lastSync.errors}</span>
                  </div>
                </div>
              ` : ''}
            </div>

            ${state.syncState.machineSummaries.length > 0 ? `
              <div class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-sm">
                <div class="p-4 border-b border-slate-200 font-bold text-slate-800 text-xs uppercase tracking-wider">
                  Riwayat Hasil Sinkronisasi Per Mesin
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 font-bold uppercase tracking-wider">
                        <th class="py-3 px-4">Nama Mesin</th>
                        <th class="py-3 px-4">IP Address</th>
                        <th class="py-3 px-4 text-center">Status</th>
                        <th class="py-3 px-4 text-right">Data Diunduh</th>
                        <th class="py-3 px-4 text-right text-emerald-600">Data Baru</th>
                        <th class="py-3 px-4 text-right">Dilewati</th>
                        <th class="py-3 px-4 text-right text-rose-600">Error</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm font-semibold">
                      ${state.syncState.machineSummaries.map((m, i) => `
                        <tr class="hover:bg-slate-50/80 transition-colors text-slate-850">
                          <td class="py-3 px-4 text-slate-900 font-bold">${m.name}</td>
                          <td class="py-3 px-4 font-mono text-xs text-slate-500">${m.ip}</td>
                          <td class="py-3 px-4 text-center">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase ${m.status === 'success'
              ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
              : 'bg-rose-50 text-rose-700 border border-rose-200'
            }">
                              ${m.status === 'success' ? 'Sukses' : 'Gagal'}
                            </span>
                          </td>
                          <td class="py-3 px-4 text-right font-mono text-slate-700">${m.downloaded}</td>
                          <td class="py-3 px-4 text-right font-mono text-emerald-600">+${m.inserted}</td>
                          <td class="py-3 px-4 text-right font-mono text-slate-400">${m.skipped}</td>
                          <td class="py-3 px-4 text-right font-mono text-rose-600">${m.errors}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }
      return '';
    }

    // Helper untuk edit device (ditempel di window scope agar dipanggil onclick inline HTML)
    window.editDevice = function (id, deviceId, nama, ip, lokasi, aktif) {
      state.editingDeviceId = id;
      state.deviceForm = { device_id: deviceId, nama, ip_address: ip, lokasi: lokasi || '', aktif };
      state.activeTab = 'devices';
      render();

      // Update form values directly
      const devIdInput = document.getElementById('dev-id');
      const devNamaInput = document.getElementById('dev-nama');
      const devIpInput = document.getElementById('dev-ip');
      const devLokasiInput = document.getElementById('dev-lokasi');

      if (devIdInput) devIdInput.value = deviceId;
      if (devNamaInput) devNamaInput.value = nama;
      if (devIpInput) devIpInput.value = ip;
      if (devLokasiInput) devLokasiInput.value = lokasi || '';
    };

    // Helper delete device dari window scope
    window.handleDeleteDevice = handleDeleteDevice;

    // --- SETUP AWAL ---
    if (state.isLoggedIn) {
      initSocket();
      fetchLogs();
      fetchDevices();
      fetchSyncStatus();
    }
    render();

  </script>
</body>

</html>
